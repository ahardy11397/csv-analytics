      "canonical_meme": "function parse_csv(text: String) -> List<List<String>>:\n    define list rows as empty List<List<String>>\n    define list row as empty List<String>\n    define field: String as \"\"\n    define i: Int as 0\n    define n: Int as length of string text\n    define in_quotes: Bool as false\n    define row_started: Bool as false\n    define field_started: Bool as false\n    while i < n:\n        define c: String as char at i of text\n        if in_quotes:\n            if c == \"\\\"\":\n                if i + 1 < n:\n                    if char at (i + 1) of text == \"\\\"\":\n                        set field to field + \"\\\"\"\n                        set field_started to true\n                        set i to i + 2\n                        continue\n                    else:\n                        set in_quotes to false\n                        set i to i + 1\n                        continue\n                else:\n                    set in_quotes to false\n                    set i to i + 1\n                    continue\n            else:\n                set field to field + c\n                set field_started to true\n                set i to i + 1\n                continue\n        if c == \"\\\"\":\n            if not field_started:\n                set in_quotes to true\n                set field_started to true\n                set row_started to true\n                set i to i + 1\n                continue\n            else:\n                set field to field + \"\\\"\"\n                set field_started to true\n                set row_started to true\n                set i to i + 1\n                continue\n        if c == \",\":\n            append field to row\n            set field to \"\"\n            set field_started to false\n            set row_started to true\n            set i to i + 1\n            continue\n        if c == \"\\n\":\n            if row_started:\n                append field to row\n                set field to \"\"\n                set field_started to false\n                append row to rows\n                set row to empty List<String>\n                set row_started to false\n            set i to i + 1\n            continue\n        if c == \"\\r\":\n            if i + 1 < n:\n                if char at (i + 1) of text == \"\\n\":\n                    set i to i + 2\n                else:\n                    set i to i + 1\n            else:\n                set i to i + 1\n            if row_started:\n                append field to row\n                set field to \"\"\n                set field_started to false\n                append row to rows\n                set row to empty List<String>\n                set row_started to false\n            continue\n        set field to field + c\n        set field_started to true\n        set row_started to true\n        set i to i + 1\n    if row_started:\n        append field to row\n        append row to rows\n    return rows\nfunction rows_are_rectangular(rows: List<List<String>>) -> Bool:\n    if length of rows <= 1:\n        return true\n    define width: Int as length of rows[0]\n    for i from 1 to length of rows - 1:\n        if length of rows[i] != width:\n            return false\n    return true\nfunction field_needs_quotes(field: String) -> Bool:\n    if field contains \",\":\n        return true\n    if field contains \"\\\"\":\n        return true\n    if field contains \"\\n\":\n        return true\n    if field contains \"\\r\":\n        return true\n    return false\nfunction text_has_control_chars(s: String) -> Bool:\n    define n: Int as length of string s\n    for i from 0 to n - 1:\n        define c: String as char at i of s\n        if c == \"\\t\":\n            continue\n        if c == \"\\n\":\n            continue\n        if c == \"\\r\":\n            continue\n        if c < \" \":\n            return true\n    return false\nfunction csv_row_to_line(row: List<String>) -> String:\n    define line: String as \"\"\n    for i from 0 to length of row - 1:\n        if i > 0:\n            set line to line + \",\"\n        define field: String as row[i]\n        if field_needs_quotes(field):\n            set field to replace \"\\\"\" with \"\\\"\\\"\" in field\n            set field to \"\\\"\" + field + \"\\\"\"\n        set line to line + field\n    return line",
