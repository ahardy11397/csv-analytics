      "canonical_meme": "record Table:\n    name: String\n    content: String\nfunction escape_json(s: String) -> String:\n    define out: String as \"\"\n    define n: Int as length of string s\n    for i from 0 to n - 1:\n        define c: String as char at i of s\n        if c == \"\\\"\":\n            set out to out + \"\\\\\\\"\"\n        else:\n            if c == \"\\\\\":\n                set out to out + \"\\\\\\\\\"\n            else:\n                if c == \"\\n\":\n                    set out to out + \"\\\\n\"\n                else:\n                    if c == \"\\r\":\n                        set out to out + \"\\\\r\"\n                    else:\n                        if c == \"\\t\":\n                            set out to out + \"\\\\t\"\n                        else:\n                            set out to out + c\n    return out\nfunction registry_to_json(tables: List<Table>) -> String:\n    if length of tables == 0:\n        return \"[]\"\n    define out: String as \"[\\n\"\n    for i from 0 to length of tables - 1:\n        define t: Table as tables[i]\n        set out to out + \"  {\\\"name\\\": \\\"\" + escape_json(t.name) + \"\\\", \\\"content\\\": \\\"\" + escape_json(t.content) + \"\\\"}\"\n        if i < length of tables - 1:\n            set out to out + \",\"\n        set out to out + \"\\n\"\n    set out to out + \"]\\n\"\n    return out\nfunction save_registry(path: String, tables: List<Table>) -> Void:\n    write file path with registry_to_json(tables)\nfunction load_registry(path: String) -> List<Table>:\n    if not file exists path:\n        return empty List<Table>\n    define loaded: Optional<List<Table>> as read json records Table from file path or else nothing\n    if loaded is nothing:\n        return empty List<Table>\n    return value of loaded\nfunction find_table(tables: List<Table>, name: String) -> Optional<Table>:\n    for each t in tables:\n        if t.name == name:\n            return optional t\n    return nothing\nfunction upsert_table(tables: List<Table>, t: Table) -> List<Table>:\n    define list out as empty List<Table>\n    for each existing in tables:\n        if not (existing.name == t.name):\n            append existing to out\n    append t to out\n    return out",
