      "canonical_meme": "function column_index(header: List<String>, name: String) -> Int:\n    for i from 0 to length of header - 1:\n        if header[i] == name:\n            return i\n    return -1\nfunction is_integer_text(s: String) -> Bool:\n    define t: String as trim s\n    define n: Int as length of string t\n    if n == 0:\n        return false\n    define start: Int as 0\n    if char at 0 of t == \"-\":\n        set start to 1\n    if start == 1 and n == 1:\n        return false\n    for i from start to n - 1:\n        if not is digit (char at i of t):\n            return false\n    return true\nfunction parse_cell_int(cell: String, colName: String) -> Int:\n    if not is_integer_text(cell):\n        fail with \"Error: column '\" + colName + \"' has non-integer value '\" + cell + \"'\"\n    return integer value of cell\nfunction count_rows(rows: List<List<String>>, filterIdx: Int, filterValue: String) -> Int:\n    define n: Int as 0\n    for i from 1 to length of rows - 1:\n        if filterIdx < 0:\n            set n to n + 1\n        else:\n            if rows[i][filterIdx] == filterValue:\n                set n to n + 1\n    return n\nfunction rows_where(rows: List<List<String>>, idx: Int, value: String) -> List<List<String>>:\n    define list out as empty List<List<String>>\n    for i from 1 to length of rows - 1:\n        if rows[i][idx] == value:\n            append rows[i] to out\n    return out\nfunction aggregate(rows: List<List<String>>, colIdx: Int, colName: String, op: String, filterIdx: Int, filterValue: String) -> Optional<Int>:\n    define have: Bool as false\n    define acc: Int as 0\n    for i from 1 to length of rows - 1:\n        if filterIdx < 0 or rows[i][filterIdx] == filterValue:\n            if op == \"count\":\n                set acc to acc + 1\n                set have to true\n            else:\n                if op == \"sum\":\n                    define v: Int as parse_cell_int(rows[i][colIdx], colName)\n                    set acc to acc + v\n                    set have to true\n                else:\n                    if op == \"min\":\n                        define v: Int as parse_cell_int(rows[i][colIdx], colName)\n                        if not have:\n                            set acc to v\n                            set have to true\n                        else:\n                            if v < acc:\n                                set acc to v\n                    else:\n                        if op == \"max\":\n                            define v: Int as parse_cell_int(rows[i][colIdx], colName)\n                            if not have:\n                                set acc to v\n                                set have to true\n                            else:\n                                if v > acc:\n                                    set acc to v\n                        else:\n                            fail with \"Error: unknown aggregation '\" + op + \"'\"\n    if op == \"sum\" or op == \"count\":\n        return optional acc\n    if have:\n        return optional acc\n    return nothing\nfunction format_avg_2dp(total: Int, count: Int) -> String:\n    define scaled: Int as total * 100\n    define q: Int as scaled / count\n    define r: Int as scaled % count\n    define neg: Bool as q < 0 or q == 0 and r < 0\n    define aq: Int as q\n    if aq < 0:\n        set aq to 0 - aq\n    define ar: Int as r\n    if ar < 0:\n        set ar to 0 - ar\n    if ar * 2 >= count:\n        set aq to aq + 1\n    define whole: Int as aq / 100\n    define cents: Int as aq % 100\n    define frac: String as text of cents\n    if cents < 10:\n        set frac to \"0\" + frac\n    if neg:\n        return \"-\" + text of whole + \".\" + frac\n    return text of whole + \".\" + frac\nfunction avg_value(rows: List<List<String>>, colIdx: Int, colName: String, filterIdx: Int, filterValue: String) -> String:\n    define total: Int as 0\n    define n: Int as 0\n    for i from 1 to length of rows - 1:\n        if filterIdx < 0 or rows[i][filterIdx] == filterValue:\n            define v: Int as parse_cell_int(rows[i][colIdx], colName)\n            set total to total + v\n            set n to n + 1\n    if n == 0:\n        fail with \"Error: no rows to average for column '\" + colName + \"'\"\n    return format_avg_2dp(total, n)\nfunction group_aggregate(rows: List<List<String>>, groupIdx: Int, valueIdx: Int, valueName: String, op: String) -> Map<String, Int>:\n    define out: Map<String, Int> as empty Map<String, Int>\n    for i from 1 to length of rows - 1:\n        define key: String as rows[i][groupIdx]\n        define cur: Int as out[key] default 0\n        if op == \"count\":\n            set out[key] to cur + 1\n        else:\n            define v: Int as parse_cell_int(rows[i][valueIdx], valueName)\n            if op == \"sum\":\n                set out[key] to cur + v\n            else:\n                if op == \"min\":\n                    if cur == 0 and not (out has key key):\n                        set out[key] to v\n                    else:\n                        if v < cur:\n                            set out[key] to v\n                else:\n                    if op == \"max\":\n                        if cur == 0 and not (out has key key):\n                            set out[key] to v\n                        else:\n                            if v > cur:\n                                set out[key] to v\n                    else:\n                        fail with \"Error: unknown aggregation '\" + op + \"'\"\n    return out\nfunction join_tables(aRows: List<List<String>>, bRows: List<List<String>>, aIdx: Int, bIdx: Int) -> List<List<String>>:\n    define list out as empty List<List<String>>\n    define list aHeader as aRows[0]\n    define list bHeader as bRows[0]\n    define list header as empty List<String>\n    for i from 0 to length of aHeader - 1:\n        append aHeader[i] to header\n    for j from 0 to length of bHeader - 1:\n        if not (j == bIdx):\n            append bHeader[j] to header\n    append header to out\n    for i from 1 to length of aRows - 1:\n        define list aRow as aRows[i]\n        define key: String as aRow[aIdx]\n        for j from 1 to length of bRows - 1:\n            define list bRow as bRows[j]\n            if bRow[bIdx] == key:\n                define list combined as empty List<String>\n                for k from 0 to length of aRow - 1:\n                    append aRow[k] to combined\n                for k from 0 to length of bRow - 1:\n                    if not (k == bIdx):\n                        append bRow[k] to combined\n                append combined to out\n    return out",
