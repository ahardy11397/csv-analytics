      "canonical_meme": "use csvparse\nuse csvstore\nuse csvquery\nfunction print_usage() -> Void:\n    print \"Usage: csv <command> [args]\"\n    print \"  csv load <file> <name>\"\n    print \"  csv tables\"\n    print \"  csv head <name> [n]\"\n    print \"  csv count <name> [column value]\"\n    print \"  csv sum|avg|min|max <name> <column> [where column value]\"\n    print \"  csv groupby <name> <group-col> <agg>(<col>)\"\n    print \"  csv join <a> <b> <column>\"\n    print \"  csv where <name> <column> <value>\"\nfunction registry_path() -> String:\n    return \"data/tables.json\"\nfunction load_table(name: String) -> Optional<Table>:\n    define list tables as load_registry(registry_path())\n    return find_table(tables, name)\nfunction parse_table(t: Table) -> List<List<String>>:\n    if text_has_control_chars(t.content):\n        fail with \"Error: table '\" + t.name + \"' contains unsupported control characters\"\n    define list rows as parse_csv(t.content)\n    if length of rows == 0:\n        fail with \"Error: table '\" + t.name + \"' is empty\"\n    if not rows_are_rectangular(rows):\n        fail with \"Error: table '\" + t.name + \"' has ragged rows\"\n    return rows\nfunction table_shape(rows: List<List<String>>) -> String:\n    return text of (length of rows - 1) + \" rows, \" + text of length of rows[0] + \" cols\"\nfunction run_load(argc: Int) -> Void:\n    if argc != 4:\n        print \"Usage: csv load <file> <name>\"\n        exit with code 1\n    define filepath: String as argument 2\n    define name: String as argument 3\n    if name contains \"/\":\n        fail with \"Error: table name may not contain '/'\"\n    if not file exists filepath:\n        fail with \"Error: cannot read file: \" + filepath\n    define content: String as read string from file filepath\n    if text_has_control_chars(content):\n        fail with \"Error: file contains unsupported control characters: \" + filepath\n    define list rows as parse_csv(content)\n    if length of rows == 0:\n        fail with \"Error: empty CSV file: \" + filepath\n    if not rows_are_rectangular(rows):\n        fail with \"Error: ragged rows in file: \" + filepath\n    define t: Table as Table(name=name, content=content)\n    define list tables as load_registry(registry_path())\n    define list updated as upsert_table(tables, t)\n    create directory \"data\"\n    call save_registry(registry_path(), updated)\n    print \"Loaded \" + name + \": \" + table_shape(rows)\nfunction run_tables() -> Void:\n    define list tables as load_registry(registry_path())\n    if length of tables == 0:\n        print \"No tables\"\n        return\n    define list names as empty List<String>\n    for each t in tables:\n        append t.name to names\n    sort names ascending\n    for each n in names:\n        define found: Optional<Table> as find_table(tables, n)\n        define t: Table as value of found\n        define list rows as parse_csv(t.content)\n        print t.name + \": \" + table_shape(rows)\nfunction run_head(argc: Int) -> Void:\n    if argc < 3 or argc > 4:\n        print \"Usage: csv head <name> [n]\"\n        exit with code 1\n    define name: String as argument 2\n    define found: Optional<Table> as load_table(name)\n    if found is nothing:\n        fail with \"Error: no table named '\" + name + \"'\"\n    define t: Table as value of found\n    define list rows as parse_table(t)\n    define n: Int as 5\n    if argc == 4:\n        define ns: String as argument 3\n        if not is_integer_text(ns):\n            fail with \"Error: n must be an integer\"\n        set n to integer value of ns\n    print csv_row_to_line(rows[0])\n    define limit: Int as n\n    if limit > length of rows - 1:\n        set limit to length of rows - 1\n    for i from 1 to limit:\n        print csv_row_to_line(rows[i])\nfunction run_count(argc: Int) -> Void:\n    if argc < 3 or argc > 5:\n        print \"Usage: csv count <name> [column value]\"\n        exit with code 1\n    define name: String as argument 2\n    define found: Optional<Table> as load_table(name)\n    if found is nothing:\n        fail with \"Error: no table named '\" + name + \"'\"\n    define t: Table as value of found\n    define list rows as parse_table(t)\n    if argc == 3:\n        print text of count_rows(rows, -1, \"\")\n        return\n    define col: String as argument 3\n    define value: String as argument 4\n    define idx: Int as column_index(rows[0], col)\n    if idx < 0:\n        fail with \"Error: no column '\" + col + \"' in table '\" + name + \"'\"\n    print text of count_rows(rows, idx, value)\nfunction run_aggregate(op: String, argc: Int) -> Void:\n    if argc < 4 or argc > 7:\n        print \"Usage: csv \" + op + \" <name> <column> [where column value]\"\n        exit with code 1\n    if argc == 5 or argc == 6:\n        fail with \"Error: expected 'where <column> <value>' after the column\"\n    define name: String as argument 2\n    define col: String as argument 3\n    define found: Optional<Table> as load_table(name)\n    if found is nothing:\n        fail with \"Error: no table named '\" + name + \"'\"\n    define t: Table as value of found\n    define list rows as parse_table(t)\n    define colIdx: Int as column_index(rows[0], col)\n    if colIdx < 0:\n        fail with \"Error: no column '\" + col + \"' in table '\" + name + \"'\"\n    define filterIdx: Int as -1\n    define filterValue: String as \"\"\n    if argc == 7:\n        if not (argument 4 == \"where\"):\n            fail with \"Error: expected 'where <column> <value>'\"\n        define fcol: String as argument 5\n        set filterValue to argument 6\n        set filterIdx to column_index(rows[0], fcol)\n        if filterIdx < 0:\n            fail with \"Error: no column '\" + fcol + \"' in table '\" + name + \"'\"\n    if op == \"avg\":\n        print avg_value(rows, colIdx, col, filterIdx, filterValue)\n        return\n    define result: Optional<Int> as aggregate(rows, colIdx, col, op, filterIdx, filterValue)\n    if result is nothing:\n        fail with \"Error: no rows for column '\" + col + \"'\"\n    print text of (value of result)\nfunction run_groupby(argc: Int) -> Void:\n    if argc != 5:\n        print \"Usage: csv groupby <name> <group-col> <agg>(<col>)\"\n        exit with code 1\n    define name: String as argument 2\n    define gcol: String as argument 3\n    define spec: String as argument 4\n    define pos: Int as index of \"(\" in spec\n    if pos < 1:\n        fail with \"Error: aggregation must look like sum(amount)\"\n    define aggop: String as trim slice spec from 0 to pos\n    define rest: String as slice spec from pos + 1 to length of string spec\n    if not (rest ends with \")\"):\n        fail with \"Error: aggregation must look like sum(amount)\"\n    define vcol: String as trim slice rest from 0 to length of string rest - 1\n    if vcol == \"\":\n        fail with \"Error: aggregation must look like sum(amount)\"\n    if not (aggop == \"sum\" or aggop == \"avg\" or aggop == \"min\" or aggop == \"max\" or aggop == \"count\"):\n        fail with \"Error: unknown aggregation '\" + aggop + \"'\"\n    define found: Optional<Table> as load_table(name)\n    if found is nothing:\n        fail with \"Error: no table named '\" + name + \"'\"\n    define t: Table as value of found\n    define list rows as parse_table(t)\n    define groupIdx: Int as column_index(rows[0], gcol)\n    if groupIdx < 0:\n        fail with \"Error: no column '\" + gcol + \"' in table '\" + name + \"'\"\n    define valueIdx: Int as column_index(rows[0], vcol)\n    if valueIdx < 0:\n        fail with \"Error: no column '\" + vcol + \"' in table '\" + name + \"'\"\n    if aggop == \"avg\":\n        define sums: Map<String, Int> as group_aggregate(rows, groupIdx, valueIdx, vcol, \"sum\")\n        define counts: Map<String, Int> as group_aggregate(rows, groupIdx, -1, \"\", \"count\")\n        for each k in sums:\n            print k + \" \" + format_avg_2dp(sums[k], counts[k])\n        return\n    define groups: Map<String, Int> as group_aggregate(rows, groupIdx, valueIdx, vcol, aggop)\n    for each k in groups:\n        print k + \" \" + text of groups[k]\nfunction run_join(argc: Int) -> Void:\n    if argc != 5:\n        print \"Usage: csv join <a> <b> <column>\"\n        exit with code 1\n    define a: String as argument 2\n    define b: String as argument 3\n    define col: String as argument 4\n    define fa: Optional<Table> as load_table(a)\n    if fa is nothing:\n        fail with \"Error: no table named '\" + a + \"'\"\n    define fb: Optional<Table> as load_table(b)\n    if fb is nothing:\n        fail with \"Error: no table named '\" + b + \"'\"\n    define ta: Table as value of fa\n    define tb: Table as value of fb\n    define list aRows as parse_table(ta)\n    define list bRows as parse_table(tb)\n    define aIdx: Int as column_index(aRows[0], col)\n    define bIdx: Int as column_index(bRows[0], col)\n    if aIdx < 0 or bIdx < 0:\n        fail with \"Error: join column '\" + col + \"' must exist in both tables\"\n    define list joined as join_tables(aRows, bRows, aIdx, bIdx)\n    for i from 0 to length of joined - 1:\n        print csv_row_to_line(joined[i])\nfunction run_where(argc: Int) -> Void:\n    if argc != 5:\n        print \"Usage: csv where <name> <column> <value>\"\n        exit with code 1\n    define name: String as argument 2\n    define col: String as argument 3\n    define value: String as argument 4\n    define found: Optional<Table> as load_table(name)\n    if found is nothing:\n        fail with \"Error: no table named '\" + name + \"'\"\n    define t: Table as value of found\n    define list rows as parse_table(t)\n    define idx: Int as column_index(rows[0], col)\n    if idx < 0:\n        fail with \"Error: no column '\" + col + \"' in table '\" + name + \"'\"\n    print csv_row_to_line(rows[0])\n    define list filtered as rows_where(rows, idx, value)\n    for each row in filtered:\n        print csv_row_to_line(row)\nfunction main() -> Int:\n    define argc: Int as argument count\n    if argc < 2:\n        call print_usage()\n        exit with code 1\n    define cmd: String as argument 1\n    match cmd:\n        when \"load\":\n            call run_load(argc)\n        when \"tables\":\n            call run_tables()\n        when \"head\":\n            call run_head(argc)\n        when \"count\":\n            call run_count(argc)\n        when \"sum\":\n            call run_aggregate(\"sum\", argc)\n        when \"avg\":\n            call run_aggregate(\"avg\", argc)\n        when \"min\":\n            call run_aggregate(\"min\", argc)\n        when \"max\":\n            call run_aggregate(\"max\", argc)\n        when \"groupby\":\n            call run_groupby(argc)\n        when \"join\":\n            call run_join(argc)\n        when \"where\":\n            call run_where(argc)\n        otherwise:\n            call print_usage()\n            exit with code 1\n    return 0\ncall main()",
