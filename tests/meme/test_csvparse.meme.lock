      "canonical_meme": "use csvparse\ntest parse_simple:\n    define list rows as parse_csv(\"a,b\\n1,2\\n\")\n    assert length of rows == 2\n    assert rows[0][0] == \"a\"\n    assert rows[0][1] == \"b\"\n    assert rows[1][0] == \"1\"\n    assert rows[1][1] == \"2\"\ntest parse_quoted_comma_and_quotes:\n    define list rows as parse_csv(\"name,note\\n\\\"x,y\\\",\\\"say \\\"\\\"hi\\\"\\\"\\\"\\n\")\n    assert rows[1][0] == \"x,y\"\n    assert rows[1][1] == \"say \\\"hi\\\"\"\ntest parse_quoted_embedded_newline:\n    define list rows as parse_csv(\"a,b\\n\\\"line1\\nline2\\\",z\\n\")\n    assert rows[1][0] == \"line1\\nline2\"\n    assert rows[1][1] == \"z\"\ntest parse_crlf:\n    define list rows as parse_csv(\"a,b\\r\\n1,2\\r\\n\")\n    assert length of rows == 2\n    assert rows[0][1] == \"b\"\n    assert rows[1][0] == \"1\"\n    assert rows[1][1] == \"2\"\ntest parse_no_trailing_newline:\n    define list rows as parse_csv(\"a,b\\n1,2\")\n    assert length of rows == 2\ntest parse_blank_line_skipped:\n    define list rows as parse_csv(\"a,b\\n\\n1,2\\n\")\n    assert length of rows == 2\ntest parse_empty_text:\n    define list rows as parse_csv(\"\")\n    assert length of rows == 0\ntest parse_single_field_rows:\n    define list rows as parse_csv(\"x\\ny\\n\")\n    assert length of rows == 2\n    assert rows[0][0] == \"x\"\n    assert rows[1][0] == \"y\"\ntest parse_empty_field_between_commas:\n    define list rows as parse_csv(\"a,,c\\n\")\n    assert rows[0][0] == \"a\"\n    assert rows[0][1] == \"\"\n    assert rows[0][2] == \"c\"\ntest rectangular_check:\n    assert rows_are_rectangular(parse_csv(\"a,b\\n1,2\\n\"))\n    assert not rows_are_rectangular(parse_csv(\"a,b\\n1\\n\"))\n    assert rows_are_rectangular(parse_csv(\"\"))\ntest row_to_line_plain:\n    define list row as [\"a\", \"b\"]\n    assert csv_row_to_line(row) == \"a,b\"\ntest row_to_line_quotes_and_commas:\n    define list row as [\"x\", \"y,z\", \"a\\\"b\", \"p\\nq\"]\n    assert csv_row_to_line(row) == \"x,\\\"y,z\\\",\\\"a\\\"\\\"b\\\",\\\"p\\nq\\\"\"\ntest row_to_line_single:\n    define list row as [\"plain\"]\n    assert csv_row_to_line(row) == \"plain\"\ntest mid_field_quote_is_literal:\n    define list rows as parse_csv(\"a,b\\n1,x\\\"y\\n2,3\\n\")\n    assert length of rows == 3\n    assert rows[1][0] == \"1\"\n    assert rows[1][1] == \"x\\\"y\"\n    assert rows[2][0] == \"2\"\ntest post_close_text_is_kept:\n    define list rows as parse_csv(\"\\\"a\\\"x\\\"b\\\",c\\n\")\n    assert length of rows == 1\n    assert rows[0][0] == \"ax\\\"b\\\"\"\n    assert rows[0][1] == \"c\"\ntest unterminated_quote_at_eof_tolerated:\n    define list rows as parse_csv(\"a,\\\"b\")\n    assert length of rows == 1\n    assert rows[0][0] == \"a\"\n    assert rows[0][1] == \"b\"\ntest trailing_comma_row:\n    define list rows as parse_csv(\"a,b,\\n1,2,3\\n\")\n    assert length of rows == 2\n    assert length of rows[0] == 3\n    assert rows[0][2] == \"\"\n    assert rows[1][2] == \"3\"\ntest lone_cr_line_end:\n    define list rows as parse_csv(\"a,b\\r1,2\\r\")\n    assert length of rows == 2\n    assert rows[1][1] == \"2\"\ntest control_char_detection:\n    assert text_has_control_chars(\"a\\u0001b\")\n    assert text_has_control_chars(\"form\\ffeed\")\n    assert not text_has_control_chars(\"plain ascii\")\n    assert not text_has_control_chars(\"tab\\tok\")\n    assert not text_has_control_chars(\"nl\\nok\")\n    assert not text_has_control_chars(\"cr\\rok\")\n    assert not text_has_control_chars(\"\")",
