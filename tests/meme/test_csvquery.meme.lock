      "canonical_meme": "use csvquery\nfunction sales_rows() -> List<List<String>>:\n    define list header as [\"region\", \"amount\", \"qty\"]\n    define list r1 as [\"east\", \"10\", \"1\"]\n    define list r2 as [\"west\", \"20\", \"2\"]\n    define list r3 as [\"east\", \"5\", \"3\"]\n    define list r4 as [\"north\", \"7\", \"1\"]\n    define list r5 as [\"west\", \"-3\", \"2\"]\n    define list rows as [header, r1, r2, r3, r4, r5]\n    return rows\ntest column_index:\n    define list header as [\"region\", \"amount\", \"qty\"]\n    assert column_index(header, \"amount\") == 1\n    assert column_index(header, \"qty\") == 2\n    assert column_index(header, \"nope\") == -1\ntest is_integer_text:\n    assert is_integer_text(\"42\")\n    assert is_integer_text(\"-3\")\n    assert is_integer_text(\" 7 \")\n    assert not is_integer_text(\"1.5\")\n    assert not is_integer_text(\"abc\")\n    assert not is_integer_text(\"\")\n    assert not is_integer_text(\"1,2\")\ntest count_all_and_filtered:\n    define list rows as sales_rows()\n    define n: Int as count_rows(rows, -1, \"\")\n    assert n == 5\n    define eastIdx: Int as column_index(rows[0], \"region\")\n    define ne: Int as count_rows(rows, eastIdx, \"east\")\n    assert ne == 2\n    define nz: Int as count_rows(rows, eastIdx, \"zealand\")\n    assert nz == 0\ntest sum_min_max:\n    define list rows as sales_rows()\n    define amt: Int as column_index(rows[0], \"amount\")\n    define s: Optional<Int> as aggregate(rows, amt, \"amount\", \"sum\", -1, \"\")\n    define sv: Int as value of s\n    assert sv == 39\n    define mn: Optional<Int> as aggregate(rows, amt, \"amount\", \"min\", -1, \"\")\n    define mv: Int as value of mn\n    assert mv == -3\n    define mx: Optional<Int> as aggregate(rows, amt, \"amount\", \"max\", -1, \"\")\n    define xv: Int as value of mx\n    assert xv == 20\ntest aggregate_with_filter:\n    define list rows as sales_rows()\n    define amt: Int as column_index(rows[0], \"amount\")\n    define reg: Int as column_index(rows[0], \"region\")\n    define s: Optional<Int> as aggregate(rows, amt, \"amount\", \"sum\", reg, \"east\")\n    define sv: Int as value of s\n    assert sv == 15\n    define mx: Optional<Int> as aggregate(rows, amt, \"amount\", \"max\", reg, \"west\")\n    define xv: Int as value of mx\n    assert xv == 20\n    define mn: Optional<Int> as aggregate(rows, amt, \"amount\", \"min\", reg, \"north\")\n    define nv: Int as value of mn\n    assert nv == 7\ntest aggregate_empty_sum_zero:\n    define list rows as sales_rows()\n    define amt: Int as column_index(rows[0], \"amount\")\n    define reg: Int as column_index(rows[0], \"region\")\n    define s: Optional<Int> as aggregate(rows, amt, \"amount\", \"sum\", reg, \"atlantis\")\n    define sv: Int as value of s\n    assert sv == 0\ntest aggregate_empty_min_max_nothing:\n    define list rows as sales_rows()\n    define amt: Int as column_index(rows[0], \"amount\")\n    define reg: Int as column_index(rows[0], \"region\")\n    define mn: Optional<Int> as aggregate(rows, amt, \"amount\", \"min\", reg, \"atlantis\")\n    assert mn is nothing\n    define mx: Optional<Int> as aggregate(rows, amt, \"amount\", \"max\", reg, \"atlantis\")\n    assert mx is nothing\ntest avg_formatting:\n    assert format_avg_2dp(39, 5) == \"7.80\"\n    assert format_avg_2dp(1, 3) == \"0.33\"\n    assert format_avg_2dp(2, 3) == \"0.67\"\n    assert format_avg_2dp(15, 2) == \"7.50\"\n    assert format_avg_2dp(5, 10) == \"0.50\"\n    assert format_avg_2dp(0, 4) == \"0.00\"\n    assert format_avg_2dp(7, 3) == \"2.33\"\n    assert format_avg_2dp(8, 3) == \"2.67\"\n    assert format_avg_2dp(1, 8) == \"0.13\"\n    assert format_avg_2dp(-3, 2) == \"-1.50\"\n    assert format_avg_2dp(-1, 3) == \"-0.33\"\n    assert format_avg_2dp(-1, 8) == \"-0.13\"\n    assert format_avg_2dp(7, 2) == \"3.50\"\ntest avg_value:\n    define list rows as sales_rows()\n    define amt: Int as column_index(rows[0], \"amount\")\n    define a: String as avg_value(rows, amt, \"amount\", -1, \"\")\n    assert a == \"7.80\"\n    define reg: Int as column_index(rows[0], \"region\")\n    define b: String as avg_value(rows, amt, \"amount\", reg, \"east\")\n    assert b == \"7.50\"\ntest group_sum_sorted_keys:\n    define list rows as sales_rows()\n    define reg: Int as column_index(rows[0], \"region\")\n    define amt: Int as column_index(rows[0], \"amount\")\n    define groups: Map<String, Int> as group_aggregate(rows, reg, amt, \"amount\", \"sum\")\n    define list keys as empty List<String>\n    for each k in groups:\n        append k to keys\n    assert length of keys == 3\n    assert keys[0] == \"east\"\n    assert keys[1] == \"north\"\n    assert keys[2] == \"west\"\n    assert groups[\"east\"] == 15\n    assert groups[\"north\"] == 7\n    assert groups[\"west\"] == 17\ntest group_min_max_count:\n    define list rows as sales_rows()\n    define reg: Int as column_index(rows[0], \"region\")\n    define amt: Int as column_index(rows[0], \"amount\")\n    define mins: Map<String, Int> as group_aggregate(rows, reg, amt, \"amount\", \"min\")\n    assert mins[\"west\"] == -3\n    assert mins[\"east\"] == 5\n    define counts: Map<String, Int> as group_aggregate(rows, reg, -1, \"\", \"count\")\n    assert counts[\"east\"] == 2\n    assert counts[\"north\"] == 1\n    assert counts[\"west\"] == 2\ntest group_min_first_value_zero:\n    define list header as [\"region\", \"amount\"]\n    define list r1 as [\"east\", \"0\"]\n    define list r2 as [\"east\", \"5\"]\n    define list r3 as [\"west\", \"2\"]\n    define list rows as [header, r1, r2, r3]\n    define reg: Int as column_index(rows[0], \"region\")\n    define amt: Int as column_index(rows[0], \"amount\")\n    define mins: Map<String, Int> as group_aggregate(rows, reg, amt, \"amount\", \"min\")\n    assert mins[\"east\"] == 0\n    define maxes: Map<String, Int> as group_aggregate(rows, reg, amt, \"amount\", \"max\")\n    assert maxes[\"east\"] == 5\n    define sums: Map<String, Int> as group_aggregate(rows, reg, amt, \"amount\", \"sum\")\n    assert sums[\"east\"] == 5\ntest rows_where:\n    define list rows as sales_rows()\n    define amt: Int as column_index(rows[0], \"amount\")\n    define list filtered as rows_where(rows, amt, \"20\")\n    assert length of filtered == 1\n    assert filtered[0][0] == \"west\"\n    define list none as rows_where(rows, amt, \"999\")\n    assert length of none == 0\ntest join_tables:\n    define list aHeader as [\"region\", \"amount\"]\n    define list a1 as [\"east\", \"10\"]\n    define list a2 as [\"west\", \"20\"]\n    define list a3 as [\"south\", \"1\"]\n    define list aRows as [aHeader, a1, a2, a3]\n    define list bHeader as [\"region\", \"mgr\"]\n    define list b1 as [\"east\", \"ann\"]\n    define list b2 as [\"west\", \"bob\"]\n    define list bRows as [bHeader, b1, b2]\n    define list joined as join_tables(aRows, bRows, 0, 0)\n    assert length of joined == 3\n    assert joined[0][0] == \"region\"\n    assert joined[0][1] == \"amount\"\n    assert joined[0][2] == \"mgr\"\n    assert joined[1][0] == \"east\"\n    assert joined[1][1] == \"10\"\n    assert joined[1][2] == \"ann\"\n    assert joined[2][0] == \"west\"\n    assert joined[2][2] == \"bob\"",
