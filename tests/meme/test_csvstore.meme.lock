      "canonical_meme": "use csvstore\ntest registry_roundtrip:\n    create directory \"tests/tmp\"\n    define t1: Table as Table(name=\"sales\", content=\"a,b\\n1,2\\n\")\n    define t2: Table as Table(name=\"weird\", content=\"n\\n\\\"x,y\\\"\\n\")\n    define t3: Table as Table(name=\"bslash\", content=\"a\\\\b\\n\")\n    define list tables as [t1, t2, t3]\n    call save_registry(\"tests/tmp/t_reg1.json\", tables)\n    define list loaded as load_registry(\"tests/tmp/t_reg1.json\")\n    assert length of loaded == 3\n    define found: Optional<Table> as find_table(loaded, \"weird\")\n    assert found is not nothing\n    define w: Table as value of found\n    assert w.content == \"n\\n\\\"x,y\\\"\\n\"\n    define found3: Optional<Table> as find_table(loaded, \"bslash\")\n    define b: Table as value of found3\n    assert b.content == \"a\\\\b\\n\"\n    delete file \"tests/tmp/t_reg1.json\"\ntest registry_missing_file_empty:\n    define list loaded as load_registry(\"tests/tmp/t_no_such_reg.json\")\n    assert length of loaded == 0\ntest registry_corrupt_tolerance:\n    create directory \"tests/tmp\"\n    write file \"tests/tmp/t_corrupt_reg.json\" with \"[{not json at all\"\n    define list loaded as load_registry(\"tests/tmp/t_corrupt_reg.json\")\n    assert length of loaded == 0\n    delete file \"tests/tmp/t_corrupt_reg.json\"\ntest upsert_replaces_and_appends:\n    define t1: Table as Table(name=\"sales\", content=\"a\\n1\\n\")\n    define t2: Table as Table(name=\"other\", content=\"b\\n2\\n\")\n    define list tables as [t1, t2]\n    define replacement: Table as Table(name=\"sales\", content=\"a\\n9\\n\")\n    define list out as upsert_table(tables, replacement)\n    assert length of out == 2\n    define found: Optional<Table> as find_table(out, \"sales\")\n    define s: Table as value of found\n    assert s.content == \"a\\n9\\n\"\n    define extra: Table as Table(name=\"third\", content=\"c\\n3\\n\")\n    define list out2 as upsert_table(out, extra)\n    assert length of out2 == 3\n    define found2: Optional<Table> as find_table(out2, \"other\")\n    define o: Table as value of found2\n    assert o.content == \"b\\n2\\n\"\ntest find_missing_returns_nothing:\n    define list tables as empty List<Table>\n    define found: Optional<Table> as find_table(tables, \"nope\")\n    assert found is nothing\ntest json_escape:\n    define s: String as \"a\\\"b\\\\c\\nd\"\n    assert escape_json(s) == \"a\\\\\\\"b\\\\\\\\c\\\\nd\"\ntest registry_json_shape:\n    define t1: Table as Table(name=\"sales\", content=\"a,b\\n1,2\\n\")\n    define list tables as [t1]\n    define j: String as registry_to_json(tables)\n    assert j == \"[\\n  {\\\"name\\\": \\\"sales\\\", \\\"content\\\": \\\"a,b\\\\n1,2\\\\n\\\"}\\n]\\n\"\ntest registry_json_empty:\n    define list tables as empty List<Table>\n    assert registry_to_json(tables) == \"[]\"",
